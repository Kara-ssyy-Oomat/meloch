    window.addEventListener('storage', e => {
      if (e.key === 'cart') { cart = JSON.parse(e.newValue || '[]'); renderCart(); }
    });

    // bfcache: страница восстановлена из кэша браузера (кнопка "Назад")
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        cart = JSON.parse(localStorage.getItem('cart') || '[]');
        renderCart();
      }
    });

    // Возврат на вкладку/приложение из фона
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        const stored = JSON.parse(localStorage.getItem('cart') || '[]');
        if (JSON.stringify(cart) !== JSON.stringify(stored)) {
          cart = stored;
          renderCart();
        }
      }
    });
    
    // ============ АГЕНТ ============
    // Если пользователь зарегистрирован как агент (localStorage.currentAgent),
    // то при оформлении заказа он ВСЕГДА вводит данные клиента отдельно,
    // а не использует свои личные данные из профиля. Это чтобы:
    //   1) В заказе значилось имя/телефон/адрес КЛИЕНТА, а не агента.
    //   2) Данные клиента НЕ перезаписывали профиль агента
    //      (userData / customerData / PersistProfile остаются его).
    function isAgentUser() {
      try {
        const raw = localStorage.getItem('currentAgent');
        if (!raw) return false;
        const a = JSON.parse(raw);
        return !!(a && a.id && a.name);
      } catch(e) { return false; }
    }

    function getAgentInfo() {
      try {
        const raw = localStorage.getItem('currentAgent');
        if (!raw) return null;
        return JSON.parse(raw);
      } catch(e) { return null; }
    }

    // ---- Список клиентов агента (для автозаполнения при след. заказах) ----
    // Хранится в localStorage.agentClients как массив { name, phone, address, updatedAt }.
    // Обновляется/добавляется КАЖДЫЙ раз, когда агент оформил заказ.
    // Не смешивается с профилем самого агента (userData/customerData).
    function _normalizePhoneKey(phone) {
      return String(phone || '').replace(/\D/g, '');
    }

    function getAgentClients() {
      try {
        const raw = localStorage.getItem('agentClients');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch(e) {}
      // Миграция из старого ключа agentLastClient (одиночная запись)
      try {
        const last = JSON.parse(localStorage.getItem('agentLastClient') || 'null');
        if (last && last.name && last.phone) {
          return [{ name: last.name, phone: last.phone, address: last.address || '', updatedAt: Date.now() }];
        }
      } catch(e) {}
      return [];
    }

    function saveAgentClient(data) {
      try {
        if (!data || !data.name || !data.phone) return;
        const list = getAgentClients();
        const phoneKey = _normalizePhoneKey(data.phone);
        if (!phoneKey) return;
        const idx = list.findIndex(c => _normalizePhoneKey(c.phone) === phoneKey);
        const record = {
          name: String(data.name).trim(),
          phone: String(data.phone).trim(),
          address: String(data.address || '').trim(),
          updatedAt: Date.now()
        };
        if (idx >= 0) {
          list[idx] = { ...list[idx], ...record };
        } else {
          list.push(record);
        }
        // Недавние — вверху; ограничение 500 клиентов
        list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        if (list.length > 500) list.length = 500;
        localStorage.setItem('agentClients', JSON.stringify(list));
        // Для обратной совместимости — также обновляем «последний клиент»
        localStorage.setItem('agentLastClient', JSON.stringify(record));
      } catch(e) {}
    }

    // Оставлено для обратной совместимости (первый диалог показывал ссылку
    // «Заполнить последнего клиента», теперь используется getAgentClients).
    function getAgentLastClient() {
      try {
        const raw = localStorage.getItem('agentLastClient');
        if (!raw) return null;
        return JSON.parse(raw);
      } catch(e) { return null; }
    }

    function saveAgentLastClient(data) { saveAgentClient(data); }

    // ---- Восстановление списка клиентов агента из Firestore ----
    // Если localStorage.agentClients был потерян (очистили Chrome, новое
    // устройство, iPad, приватный режим и т.п.) — подтягиваем клиентов,
    // связанных с этим агентом, из облака и мёржим в localStorage.
    // Источники:
    //   1) customers.where(registeredByAgentId == agentId) — клиенты,
    //      которых агент сам создал при оформлении заказа
    //   2) clientAgents.where(agentId == agentId) — клиенты, назначенные
    //      админом через admin-agents.html (там нет адреса → тянем
    //      адрес из соответствующего customers-документа).
    //
    // Функция мемоизирована (в _agentRestorePromise). Первый вызов запускает
    // сетевой запрос, все последующие ждут тот же промис (без повторных
    // запросов в Firestore). Возвращает количество восстановленных клиентов.
    let _agentRestorePromise = null;
    function restoreAgentClientsFromCloud() {
      if (_agentRestorePromise) return _agentRestorePromise;
      _agentRestorePromise = (async () => {
        try {
          if (!isAgentUser()) return 0;
          const agentInfo = getAgentInfo();
          if (!agentInfo || !agentInfo.id) return 0;
          if (typeof db === 'undefined' || !db) return 0;

          if (typeof kerbenWaitForAuth === 'function') {
            try { await kerbenWaitForAuth(); } catch(e) {}
          }

          console.log('[Cart] Восстановление клиентов агента:', agentInfo.name || agentInfo.id);

          const [customersSnap, clientAgentsSnap] = await Promise.all([
            db.collection('customers')
              .where('registeredByAgentId', '==', agentInfo.id)
              .limit(500).get().catch(err => { console.warn('[Cart] customers query error:', err && err.message); return null; }),
            db.collection('clientAgents')
              .where('agentId', '==', agentInfo.id)
              .limit(500).get().catch(err => { console.warn('[Cart] clientAgents query error:', err && err.message); return null; })
          ]);

          const restored = new Map();

          const _tsToMs = (t) => {
            if (!t) return 0;
            if (typeof t === 'number') return t;
            if (typeof t.toMillis === 'function') { try { return t.toMillis(); } catch(e) {} }
            if (typeof t.seconds === 'number') return t.seconds * 1000;
            return 0;
          };

          if (customersSnap) {
            console.log('[Cart] customers (registeredByAgentId):', customersSnap.size);
            customersSnap.forEach(doc => {
              const d = doc.data() || {};
              const phone = d.phone || doc.id;
              const key = _normalizePhoneKey(phone);
              if (!key || !d.name) return;
              // Для облачных записей без createdAt → 0 (очень старые),
              // чтобы при мёрже они НЕ перезаписали более свежие локальные
              // правки (например, если агент вручную поменял имя клиента).
              restored.set(key, {
                name: d.name,
                phone: phone,
                address: d.address || '',
                updatedAt: _tsToMs(d.createdAt) || _tsToMs(d.updatedAt) || 0
              });
            });
          }

          if (clientAgentsSnap && clientAgentsSnap.size > 0) {
            console.log('[Cart] clientAgents (agentId):', clientAgentsSnap.size);
            const joinPromises = [];
            clientAgentsSnap.forEach(doc => {
              const d = doc.data() || {};
              const phone = d.phone || doc.id;
              const key = _normalizePhoneKey(phone);
              if (!key) return;
              if (restored.has(key)) return;
              joinPromises.push((async () => {
                let address = '';
                let name = d.clientName || '';
                try {
                  const cDoc = await db.collection('customers').doc(phone).get();
                  if (cDoc && cDoc.exists) {
                    const cd = cDoc.data() || {};
                    address = cd.address || '';
                    if (!name) name = cd.name || '';
                  }
                } catch(e) {}
                if (!name) name = 'Клиент';
                restored.set(key, {
                  name: name,
                  phone: phone,
                  address: address,
                  updatedAt: _tsToMs(d.updatedAt) || 0
                });
              })());
            });
            await Promise.all(joinPromises);
          }

          if (restored.size === 0) {
            console.log('[Cart] В облаке нет клиентов, привязанных к этому агенту');
            return 0;
          }

          const existing = getAgentClients();
          const merged = new Map();
          for (const c of existing) {
            const k = _normalizePhoneKey(c.phone);
            if (k) merged.set(k, c);
          }
          for (const [k, c] of restored.entries()) {
            const cur = merged.get(k);
            if (!cur || (c.updatedAt || 0) > (cur.updatedAt || 0)) {
              merged.set(k, c);
            }
          }

          const list = Array.from(merged.values())
            .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
            .slice(0, 500);
          try { localStorage.setItem('agentClients', JSON.stringify(list)); } catch(e) {}
          try { localStorage.setItem('agentLastClient', JSON.stringify(list[0])); } catch(e) {}

          console.log('[Cart] Восстановлено клиентов из облака:', restored.size,
            '(итого в списке:', list.length + ')');
          return list.length;
        } catch(e) {
          console.warn('[Cart] Ошибка восстановления клиентов агента:', e && e.message);
          _agentRestorePromise = null; // разрешаем ретрай при ошибке
          return 0;
        }
      })();
      return _agentRestorePromise;
    }

    // ---- Поиск клиентов агента (для автоподсказок) ----
    // Умеет:
    //   • точное совпадение подстроки (fast path)
    //   • fuzzy match: буквы запроса идут в правильном порядке в имени
    //     (например «иля» → «Илья», «ali» → «Almazbek», и т.п.)
    //   • поиск по имени, телефону, адресу
    function _agentSearchNormalize(s) {
      return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function _agentSubsequenceMatch(query, target) {
      // Все символы query встречаются в target в правильном порядке
      let qi = 0;
      for (let ti = 0; ti < target.length && qi < query.length; ti++) {
        if (target[ti] === query[qi]) qi++;
      }
      return qi === query.length;
    }

    function searchAgentClients(query, limit) {
      const q = _agentSearchNormalize(query);
      if (!q) return [];
      const list = getAgentClients();
      const qDigits = q.replace(/\D/g, '');
      const scored = [];
      for (const c of list) {
        const nameN = _agentSearchNormalize(c.name);
        const addressN = _agentSearchNormalize(c.address);
        const phoneDigits = _normalizePhoneKey(c.phone);

        let score = 0;
        // 1) Точный префикс по имени — самый высокий приоритет
        if (nameN.startsWith(q)) score = 100;
        // 2) Подстрока в имени
        else if (nameN.includes(q)) score = 80;
        // 3) Телефон по цифрам (например «707» → +996 707 ...)
        else if (qDigits && phoneDigits.includes(qDigits)) score = 70;
        // 4) Подстрока в адресе
        else if (addressN.includes(q)) score = 50;
        // 5) Fuzzy по имени (буквы в правильном порядке)
        else if (_agentSubsequenceMatch(q, nameN)) score = 30;

        if (score > 0) {
          scored.push({ client: c, score });
        }
      }
      // Сортировка: по score (убывание), потом по updatedAt (свежие сверху)
      scored.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return (b.client.updatedAt || 0) - (a.client.updatedAt || 0);
      });
      const max = limit || 8;
      return scored.slice(0, max).map(x => x.client);
    }

    function _agentEscapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])
      );
    }

    // Подключить автоподсказки к SweetAlert-форме заказа (только для агентов).
    // Ищет по имени/телефону/адресу. Выпадающий список появляется прямо под
    // тем полем, в котором пользователь сейчас печатает (перемещается по DOM).
    // При клике по подсказке — все три поля (имя/телефон/адрес) заполняются.
    // Все слушатели вешаются с AbortSignal — их автоматически снесёт cleanup()
    // (вызывается из willClose SweetAlert), чтобы не было утечек памяти.
    function setupAgentClientAutocomplete() {
      const nameInput = document.getElementById('swal-name');
      const phoneInput = document.getElementById('swal-phone');
      const addressInput = document.getElementById('swal-address');
      const suggestBox = document.getElementById('swal-agent-suggest');
      if (!nameInput || !phoneInput || !addressInput || !suggestBox) {
        return function noop() {};
      }

      const abortController = (typeof AbortController !== 'undefined')
        ? new AbortController() : null;
      const signal = abortController ? abortController.signal : undefined;

      const allInputs = [nameInput, phoneInput, addressInput];
      let currentMatches = [];
      let restoring = false;

      // Если локальный список пустой — фоново подтягиваем клиентов
      // из Firestore. Когда они появятся, повторно рендерим подсказки
      // для текущего активного поля.
      if (getAgentClients().length === 0) {
        restoring = true;
        Promise.resolve(restoreAgentClientsFromCloud()).then(count => {
          restoring = false;
          if (count > 0) {
            // Обновляем счётчик в баннере, если он есть
            try {
              const banner = document.querySelector('#swal-agent-suggest')
                ?.closest('.swal2-html-container')?.querySelector('[data-agent-count]');
              if (banner) banner.textContent = String(count);
            } catch(e) {}
            // Если у пользователя уже что-то введено — перерисуем подсказки
            const active = document.activeElement;
            if (active && allInputs.includes(active) && active.value) {
              renderFor(active, active.value);
            }
          }
        });
      }

      function hide() {
        try { suggestBox.style.display = 'none'; } catch(e) {}
      }

      // Перемещаем бокс подсказок в контейнер активного поля,
      // чтобы он появлялся прямо под нужным input.
      function moveSuggestBoxTo(input) {
        const parent = input.parentElement;
        if (parent && suggestBox.parentElement !== parent) {
          parent.appendChild(suggestBox);
        }
      }

      function renderFor(input, query) {
        moveSuggestBoxTo(input);
        currentMatches = searchAgentClients(query, 8);
        if (currentMatches.length === 0) { hide(); return; }
        suggestBox.innerHTML = currentMatches.map((c, i) => `
          <div class="agent-suggest-item" data-idx="${i}" style="padding:10px 12px; cursor:pointer; border-bottom:1px solid #f0f0f0; transition:background 0.1s;">
            <div style="font-weight:600; font-size:14px; color:#333;">${_agentEscapeHtml(c.name)}</div>
            <div style="font-size:12px; color:#666; margin-top:2px;">📞 ${_agentEscapeHtml(c.phone)}</div>
            ${c.address ? `<div style="font-size:11px; color:#888; margin-top:2px;">📍 ${_agentEscapeHtml(c.address)}</div>` : ''}
          </div>
        `).join('');
        suggestBox.style.display = 'block';
        // innerHTML заменил всё содержимое — новые обработчики привязываем к
        // свежим DOM-узлам. Старые уничтожаются вместе со старыми узлами.
        suggestBox.querySelectorAll('.agent-suggest-item').forEach(el => {
          // mousedown — чтобы сработать ДО blur input (иначе suggestBox спрячется)
          el.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const idx = parseInt(el.dataset.idx, 10);
            const c = currentMatches[idx];
            if (!c) return;
            nameInput.value = c.name || '';
            phoneInput.value = c.phone || '';
            addressInput.value = c.address || '';
            hide();
          }, signal ? { signal } : undefined);
          el.addEventListener('mouseenter', () => { el.style.background = '#f5f5f5'; }, signal ? { signal } : undefined);
          el.addEventListener('mouseleave', () => { el.style.background = '#fff'; }, signal ? { signal } : undefined);
        });
      }

      // Подписываемся на все три поля
      allInputs.forEach(inp => {
        inp.addEventListener('input', () => renderFor(inp, inp.value), signal ? { signal } : undefined);
        inp.addEventListener('focus', () => renderFor(inp, inp.value), signal ? { signal } : undefined);
      });

      // Скрываем при клике вне поля/списка
      const outsideHandler = (e) => {
        if (suggestBox.contains(e.target)) return;
        if (allInputs.includes(e.target)) return;
        hide();
      };
      document.addEventListener('mousedown', outsideHandler, signal ? { signal } : undefined);

      // Cleanup: вызвать в willClose SweetAlert, чтобы снести все обработчики
      return function cleanup() {
        try {
          if (abortController) {
            abortController.abort();
          } else {
            // Фоллбэк для старых браузеров без AbortController
            document.removeEventListener('mousedown', outsideHandler);
          }
        } catch(e) {}
      };
    }

    // Получение данных клиента из профиля / localStorage
    function getCustomerData() {
      // Если это АГЕНТ — не подставляем данные из его профиля,
      // всегда будем показывать форму ввода данных клиента.
      if (isAgentUser()) return null;

      // 1. Сначала из customerData (авторизованный клиент)
      try {
        const customer = JSON.parse(localStorage.getItem('customerData') || 'null');
        if (customer && customer.name && customer.phone) {
          return {
            name: customer.name,
            phone: customer.phone,
            address: customer.address || ''
          };
        }
      } catch(e) {}
      
      // 2. Из userData (сохранённые данные предыдущего заказа)
      try {
        const saved = JSON.parse(localStorage.getItem('userData') || '{}');
        if (saved.name && saved.phone) {
          return {
            name: saved.name,
            phone: saved.phone,
            address: saved.address || ''
          };
        }
      } catch(e) {}
      
      return null;
    }
    
    function getDriverData() {
      try {
        const saved = JSON.parse(localStorage.getItem('userData') || '{}');
        return {
          driverName: saved.driverName || '',
          driverPhone: saved.driverPhone || ''
        };
      } catch(e) {}
      return { driverName: '', driverPhone: '' };
    }
    
    // Получение партнера
    function getCurrentPartner() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        if (ref) { localStorage.setItem('referralPartner', ref); return ref; }
      } catch(e) {}
      try {
        const savedRef = localStorage.getItem('referralPartner');
        if (savedRef) return savedRef;
      } catch(e) {}
      let savedData = sessionStorage.getItem('partnerData');
      if (!savedData) { try { savedData = localStorage.getItem('partnerData'); } catch(e) {} }
      if (!savedData) return null;
      try {
        const partnerData = JSON.parse(savedData);
        const daysPassed = (Date.now() - partnerData.timestamp) / (1000 * 60 * 60 * 24);
        if (daysPassed <= 30) return partnerData.name;
        sessionStorage.removeItem('partnerData');
        try { localStorage.removeItem('partnerData'); } catch(e) {}
      } catch(e) {}
      return null;
    }

    // Сохранение заказа в локальную историю
    function saveOrderToHistory(order) {
      try {
        const history = JSON.parse(localStorage.getItem('orderHistory') || '[]');
        history.unshift(order);
        if (history.length > 50) history.length = 50;
        localStorage.setItem('orderHistory', JSON.stringify(history));
      } catch(e) {}
    }

    // ============ ОТПРАВКА ЗАКАЗА ============
    async function submitOrderFromCart() {
      const submitBtn = document.getElementById('submitOrderBtn');
      
      if (cart.length === 0) {
        Swal.fire('Ошибка', 'Корзина пуста', 'warning');
        return;
      }

      // Проверка минимальной суммы заказа
      if (minOrderEnabled && minOrderAmount > 0) {
        const cartTotal = cart.reduce((sum, item) => sum + item.qty * item.price, 0);
        if (cartTotal < minOrderAmount) {
          // Проверяем обход: клиент уже заказывал сегодня >= минимума
          let bypassed = false;
          try {
            const bp = JSON.parse(localStorage.getItem('minOrderBypass') || 'null');
            if (bp && bp.until > Date.now()) bypassed = true;
          } catch(e) {}
          if (!bypassed) {
            Swal.fire({
              icon: 'warning',
              title: 'Минимальная сумма заказа',
              html: `Минимальная сумма заказа: <b>${minOrderAmount.toLocaleString()} сом</b>.<br>Сейчас в корзине: <b>${cartTotal.toLocaleString()} сом</b>.<br><br>Добавьте ещё товаров на <b>${(minOrderAmount - cartTotal).toLocaleString()} сом</b>.`,
              confirmButtonText: 'Понятно'
            });
            return;
          }
        }
      }

      // Антиспам
      try {
        const cooldownUntil = parseInt(localStorage.getItem('firestoreCooldownUntil') || '0', 10) || 0;
        if (Date.now() < cooldownUntil) {
          const sec = Math.ceil((cooldownUntil - Date.now()) / 1000);
          Swal.fire('Подождите', `Слишком много запросов. Повторите через ${sec} сек.`, 'warning');
          return;
        }
      } catch(e) {}

      // Получаем данные клиента из профиля
      let customerInfo = getCustomerData();
      const driverInfo = getDriverData();
      const savedRef = localStorage.getItem('savedReferredBy') || '';

      // === АГЕНТ ===
      // Если пользователь — агент, вместо своих данных всегда просим ввести
      // данные КЛИЕНТА (имя, телефон, адрес). Показываем баннер сверху
      // и (если есть) автоподсказки из ранее сохранённых клиентов.
      const isAgent = isAgentUser();
      const agentInfo = isAgent ? getAgentInfo() : null;
      const agentClientsCount = isAgent ? getAgentClients().length : 0;

      const agentBannerHtml = agentInfo ? `
        <div style="background:linear-gradient(135deg,#fff3e0,#ffe0b2); border:2px solid #ff9800; padding:12px; border-radius:10px; margin-bottom:14px; text-align:left;">
          <div style="font-size:14px; font-weight:700; color:#e65100; margin-bottom:4px;">👤 Заказ от агента: ${_agentEscapeHtml(agentInfo.name)}</div>
          <div style="font-size:12px; color:#bf360c;">Введите данные <b>КЛИЕНТА</b>, для которого оформляете заказ.</div>
          ${agentClientsCount > 0 ? `<div style="margin-top:6px; font-size:11px; color:#795548;">💡 Сохранено клиентов: <b>${agentClientsCount}</b>. Начните вводить имя или телефон — появятся подсказки.</div>` : ''}
        </div>` : '';

      const customerFieldLabels = isAgent
        ? { name: 'Имя клиента', phone: 'Телефон клиента', address: 'Адрес клиента' }
        : { name: 'Ваше имя', phone: 'Телефон', address: 'Адрес доставки' };

      // Блок автоподсказок — только для агентов (пустой div, наполняется JS-ом
      // в didOpen через setupAgentClientAutocomplete()).
      const agentSuggestBoxHtml = isAgent ? `
        <div id="swal-agent-suggest" style="position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #ddd; border-radius:8px; max-height:240px; overflow-y:auto; z-index:9999; display:none; box-shadow:0 6px 20px rgba(0,0,0,0.15); margin-top:4px;"></div>
      ` : '';

      // Если данных нет — спрашиваем через диалог
      if (!customerInfo || !customerInfo.name || !customerInfo.phone) {
        const result = await Swal.fire({
          title: isAgent ? '📋 Данные клиента' : '📋 Данные для заказа',
          html: `
            <div style="text-align:left;">
              ${agentBannerHtml}
              <div style="margin-bottom:12px; position:relative;">
                <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px;">${customerFieldLabels.name} *</label>
                <input type="text" id="swal-name" autocomplete="off" value="${customerInfo?.name || ''}" placeholder="${isAgent ? 'Имя клиента' : 'Введите имя'}" style="width:100%; padding:12px; border:2px solid #4CAF50; border-radius:8px; font-size:16px; box-sizing:border-box;">
              </div>
              <div style="margin-bottom:12px; position:relative;">
                <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px;">${customerFieldLabels.phone} *</label>
                <input type="tel" id="swal-phone" autocomplete="off" value="${customerInfo?.phone || ''}" placeholder="+996 ..." style="width:100%; padding:12px; border:2px solid #4CAF50; border-radius:8px; font-size:16px; box-sizing:border-box;">
                ${agentSuggestBoxHtml}
              </div>
              <div style="margin-bottom:12px; position:relative;">
                <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px;">${customerFieldLabels.address} *</label>
                <input type="text" id="swal-address" autocomplete="off" value="${customerInfo?.address || ''}" placeholder="Город, улица, дом" style="width:100%; padding:12px; border:2px solid #4CAF50; border-radius:8px; font-size:16px; box-sizing:border-box;">
              </div>
              <hr style="border:none; border-top:1px solid #eee; margin:14px 0;">
              <div style="margin-bottom:10px;">
                <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px; color:#888;">Имя водителя <span style="font-size:11px;">(необяз.)</span></label>
                <input type="text" id="swal-driver-name" value="${driverInfo.driverName}" placeholder="Имя водителя" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; background:#f9f9f9;">
              </div>
              <div style="margin-bottom:10px;">
                <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px; color:#888;">Номер водителя <span style="font-size:11px;">(необяз.)</span></label>
                <input type="tel" id="swal-driver-phone" value="${driverInfo.driverPhone}" placeholder="Номер водителя" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; background:#f9f9f9;">
              </div>
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: '📦 Отправить заказ',
          cancelButtonText: 'Отмена',
          confirmButtonColor: '#4CAF50',
          didOpen: () => {
            // Автоподсказки клиентов (только для агентов).
            // Сохраняем cleanup, чтобы снести обработчики при закрытии диалога.
            if (isAgent) {
              const cleanup = setupAgentClientAutocomplete();
              const popup = Swal.getPopup();
              if (popup) popup.__agentAutocompleteCleanup = cleanup;
            }
          },
          willClose: () => {
            const popup = Swal.getPopup();
            if (popup && typeof popup.__agentAutocompleteCleanup === 'function') {
              try { popup.__agentAutocompleteCleanup(); } catch(e) {}
              popup.__agentAutocompleteCleanup = null;
            }
          },
          preConfirm: () => {
            const n = document.getElementById('swal-name').value.trim();
            const p = document.getElementById('swal-phone').value.trim();
            const a = document.getElementById('swal-address').value.trim();
            if (!n || !p || !a) { Swal.showValidationMessage('Заполните имя, телефон и адрес'); return false; }
            return {
              name: n, phone: p, address: a,
              driverName: document.getElementById('swal-driver-name').value.trim(),
              driverPhone: document.getElementById('swal-driver-phone').value.trim()
            };
          }
        });
        if (!result.isConfirmed) return;
        customerInfo = { name: result.value.name, phone: result.value.phone, address: result.value.address };
        driverInfo.driverName = result.value.driverName;
        driverInfo.driverPhone = result.value.driverPhone;
      } else {
        // Данные есть — показываем подтверждение с возможностью изменить
        const total = cart.reduce((sum, item) => sum + item.qty * item.price, 0);
        const result = await Swal.fire({
          title: '📦 Подтвердите заказ',
          html: `
            <div style="text-align:left; font-size:14px;">
              ${agentBannerHtml}
              <div style="background:#f0f7f0; padding:14px; border-radius:10px; margin-bottom:12px;">
                <div style="font-weight:700; margin-bottom:6px;">${isAgent ? '👤 Клиент: ' : '👤 '}${customerInfo.name}</div>
                <div style="color:#555;">📞 ${customerInfo.phone}</div>
                <div style="color:#555;">📍 ${customerInfo.address || 'Не указан'}</div>
                ${driverInfo.driverName ? '<div style="color:#17a2b8; margin-top:6px;">🚗 ' + driverInfo.driverName + (driverInfo.driverPhone ? ' • ' + driverInfo.driverPhone : '') + '</div>' : ''}
              </div>
              <div style="text-align:center; font-size:20px; font-weight:700; color:#333;">Итого: ${total.toLocaleString()} сом</div>
              <div style="text-align:center; margin-top:6px;"><a href="#" id="swal-change-data" style="color:#1565c0; font-size:13px;">Изменить данные</a></div>
            </div>
          `,
          showCancelButton: true,
          confirmButtonText: '✅ Отправить',
          cancelButtonText: 'Отмена',
          confirmButtonColor: '#4CAF50',
          didOpen: () => {
            document.getElementById('swal-change-data').addEventListener('click', (e) => {
              e.preventDefault();
              Swal.close({ isConfirmed: false, isDismissed: true, dismiss: 'change' });
            });
          }
        });
        
        if (result.dismiss === 'change') {
          // Открываем форму редактирования
          const editResult = await Swal.fire({
            title: isAgent ? '✏️ Данные клиента' : '✏️ Изменить данные',
            html: `
              <div style="text-align:left;">
                ${agentBannerHtml}
                <div style="margin-bottom:12px; position:relative;">
                  <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px;">${customerFieldLabels.name} *</label>
                  <input type="text" id="swal-name" autocomplete="off" value="${customerInfo.name}" style="width:100%; padding:12px; border:2px solid #4CAF50; border-radius:8px; font-size:16px; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:12px; position:relative;">
                  <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px;">${customerFieldLabels.phone} *</label>
                  <input type="tel" id="swal-phone" autocomplete="off" value="${customerInfo.phone}" style="width:100%; padding:12px; border:2px solid #4CAF50; border-radius:8px; font-size:16px; box-sizing:border-box;">
                  ${agentSuggestBoxHtml}
                </div>
                <div style="margin-bottom:12px; position:relative;">
                  <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px;">${customerFieldLabels.address} *</label>
                  <input type="text" id="swal-address" autocomplete="off" value="${customerInfo.address}" style="width:100%; padding:12px; border:2px solid #4CAF50; border-radius:8px; font-size:16px; box-sizing:border-box;">
                </div>
                <hr style="border:none; border-top:1px solid #eee; margin:14px 0;">
                <div style="margin-bottom:10px;">
                  <label style="display:block; margin-bottom:4px; font-weight:600; font-size:13px; color:#888;">Водитель</label>
                  <input type="text" id="swal-driver-name" value="${driverInfo.driverName}" placeholder="Имя" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; background:#f9f9f9; margin-bottom:8px;">
                  <input type="tel" id="swal-driver-phone" value="${driverInfo.driverPhone}" placeholder="Телефон" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:15px; box-sizing:border-box; background:#f9f9f9;">
                </div>
              </div>
            `,
            showCancelButton: true,
            confirmButtonText: '📦 Отправить',
            cancelButtonText: 'Отмена',
            confirmButtonColor: '#4CAF50',
            didOpen: () => {
              if (isAgent) {
                const cleanup = setupAgentClientAutocomplete();
                const popup = Swal.getPopup();
                if (popup) popup.__agentAutocompleteCleanup = cleanup;
              }
            },
            willClose: () => {
              const popup = Swal.getPopup();
              if (popup && typeof popup.__agentAutocompleteCleanup === 'function') {
                try { popup.__agentAutocompleteCleanup(); } catch(e) {}
                popup.__agentAutocompleteCleanup = null;
              }
            },
            preConfirm: () => {
              const n = document.getElementById('swal-name').value.trim();
              const p = document.getElementById('swal-phone').value.trim();
              const a = document.getElementById('swal-address').value.trim();
              if (!n || !p || !a) { Swal.showValidationMessage('Заполните имя, телефон и адрес'); return false; }
              return { name: n, phone: p, address: a, driverName: document.getElementById('swal-driver-name').value.trim(), driverPhone: document.getElementById('swal-driver-phone').value.trim() };
            }
          });
          if (!editResult.isConfirmed) return;
          customerInfo = { name: editResult.value.name, phone: editResult.value.phone, address: editResult.value.address };
          driverInfo.driverName = editResult.value.driverName;
          driverInfo.driverPhone = editResult.value.driverPhone;
        } else if (!result.isConfirmed) {
          return;
        }
      }

      const name = customerInfo.name;
      const phone = customerInfo.phone;
      const address = customerInfo.address;
      let driverName = driverInfo.driverName;
      let driverPhone = driverInfo.driverPhone;
      const referredBy = savedRef;

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.5';
      const originalText = submitBtn.textContent;
      submitBtn.textContent = '⏳ Проверка товаров...';

      try {
        // Если товары не были загружены — пробуем загрузить перед валидацией
        if (!productsLoadedOk || products.length === 0) {
          submitBtn.textContent = '⏳ Загрузка товаров...';
          await loadProducts();
        }

        const validCart = [];
        const problems = { blocked: [], deleted: [], outOfStock: [] };

        // Валидацию товаров делаем ТОЛЬКО если товары реально загружены.
        // Если products пуст (ошибка сети/auth) — пропускаем проверку
        // и отправляем заказ как есть (серверная логика отловит проблемы).
        if (productsLoadedOk && products.length > 0) {
          for (const cartItem of cart) {
            const product = products.find(p => p.id === cartItem.id);
            if (!product) {
              problems.deleted.push(cartItem.title);
            } else if (product.blocked) {
              problems.blocked.push(cartItem.title);
            } else if (!warehousePaused && typeof getEffectiveStock === 'function') {
              const stock = getEffectiveStock(product);
              if (stock === null) {
                validCart.push({ ...cartItem, title: product.title, price: product.price, costPrice: product.costPrice || 0, sellerId: product.sellerId || null, sellerName: product.sellerName || null });
              } else if (stock <= 0) {
                problems.outOfStock.push(`${cartItem.title} (нет в наличии)`);
              } else if ((cartItem.qty || 0) > stock) {
                problems.outOfStock.push(`${cartItem.title} (доступно ${stock} шт)`);
              } else {
                validCart.push({ ...cartItem, title: product.title, price: product.price, costPrice: product.costPrice || 0, sellerId: product.sellerId || null, sellerName: product.sellerName || null });
              }
            } else {
              validCart.push({ ...cartItem, title: product.title, price: product.price, costPrice: product.costPrice || 0, sellerId: product.sellerId || null, sellerName: product.sellerName || null });
            }
          }
        } else {
          // Товары не удалось загрузить — принимаем заказ без проверки
          console.warn('[Cart] Товары не загружены — пропускаем валидацию, отправляем заказ как есть');
          validCart.push(...cart.map(item => ({ ...item })));
        }
        
        // Обработка проблемных товаров
        if (problems.blocked.length || problems.deleted.length || problems.outOfStock.length) {
          let warningText = '';
          if (problems.blocked.length) warningText += '<div style="color:#dc3545; margin:10px 0;"><strong>❌ Заблокированы:</strong><br>' + problems.blocked.join('<br>') + '</div>';
          if (problems.deleted.length) warningText += '<div style="color:#dc3545; margin:10px 0;"><strong>🗑️ Удалены:</strong><br>' + problems.deleted.join('<br>') + '</div>';
          if (problems.outOfStock.length) warningText += '<div style="color:#dc3545; margin:10px 0;"><strong>📦 Нет остатка:</strong><br>' + problems.outOfStock.join('<br>') + '</div>';
          
          if (validCart.length === 0) {
            Swal.fire({ icon: 'error', title: 'Невозможно оформить', html: warningText + '<br><strong>Все товары недоступны.</strong>' });
            cart.length = 0; saveCart(); renderCart();
            submitBtn.disabled = false; submitBtn.style.opacity = '1'; submitBtn.textContent = originalText;
            return;
          }
          
          const r = await Swal.fire({
            icon: 'warning', title: 'Внимание!',
            html: warningText + `<br><strong style="color:#28a745;">✓ Доступные (${validCart.length} шт) можно заказать.</strong><br><br>Продолжить?`,
            showCancelButton: true, confirmButtonText: 'Да', cancelButtonText: 'Отмена', confirmButtonColor: '#28a745'
          });
          if (!r.isConfirmed) { submitBtn.disabled = false; submitBtn.style.opacity = '1'; submitBtn.textContent = originalText; return; }
          cart.length = 0; cart.push(...validCart); saveCart();
        }

        submitBtn.textContent = '⏳ Отправка...';

        // let (не const) — пересчитываются после финальной проверки остатков
        // (см. блок «ФИНАЛЬНАЯ ПРОВЕРКА» ниже), если пришлось автоматически
        // урезать количество или убрать распроданные товары.
        let items = cart.map(i => {
          const product = products.find(p => p.id === i.id);
          const unitLabel = (product && product.isPack) ? 'пачка' : 'шт';
          const packInfo = (product && product.isPack && product.packQty) ? ` (~${product.packQty} шт/пачка)` : '';
          const variantInfo = i.variant ? ` [${i.variant}]` : '';
          return `${i.title}${variantInfo}${packInfo} — ${i.qty} ${unitLabel} × ${i.price} сом = ${i.qty * i.price} сом`;
        }).join('\n');
        let total = cart.reduce((sum, item) => sum + item.qty * item.price, 0);
        const currentTime = new Date().toLocaleString();

        // Поиск партнёра — с таймаутом 1.2 сек (не блокируем заказ).
        // Раньше было 3с — на медленных сетях это заметная задержка перед
        // самим .set(). Если не подхватилось за 1.2с — partner=null, не
        // критично (можно назначить админом позже).
        let partner = getCurrentPartner();
        if (!partner && referredBy) partner = referredBy;
        // Если заказ оформляет сам агент — партнёром автоматически становится он
        // (его комиссия/статистика привяжется к этому заказу).
        if (!partner && agentInfo && agentInfo.name) {
          partner = agentInfo.name;
        }
        // Запускаем параллельно поиск партнёра и ожидание auth — оба
        // независимы, зачем ждать последовательно. Плюс параллельно ниже
        // будет freshDocsP (проверка остатков).
        const partnerLookupP = (!partner && phone)
          ? Promise.race([
              db.collection('clientAgents').doc(phone).get().catch(() => null),
              new Promise(r => setTimeout(() => r(null), 1200))
            ]).then(cad => (cad && cad.exists) ? cad.data().agentName : null)
              .catch(() => null)
          : Promise.resolve(null);
        if (referredBy) try { localStorage.setItem('savedReferredBy', referredBy); } catch(e) {}

        // ══════════════════════════════════════════════════════════════════
        // ФИНАЛЬНАЯ ПРОВЕРКА ОСТАТКОВ ПРОТИВ БД (защита от гонок)
        // Автоматически:
        //   • товар исчез/распродан → УБИРАЕМ из корзины
        //   • нужно 5, а осталось 3 → УРЕЗАЕМ до 3
        //   • всё ок → без изменений
        // Если ВСЯ корзина оказалась недоступна → заказ ВСЁ РАВНО создаётся
        // как unfulfilled, чтобы админ видел потерянную продажу. Склад не
        // списывается, клиенту показывается сообщение «менеджер свяжется».
        // ══════════════════════════════════════════════════════════════════
        let orderAdjustments = [];
        let isUnfulfilledOrder = false;
        const originalCartSnapshot = cart.map(i => ({ ...i }));

        if ((typeof warehousePaused === 'undefined' || !warehousePaused) && cart.length > 0) {
          submitBtn.textContent = '⏳ Отправка заказа...';
          try {
            // ЖЁСТКИЙ ТАЙМАУТ 1.5 сек: клиент НЕ должен ждать долго перед
            // отправкой. Если проверка не успела — уезжаем как есть,
            // CF на сервере защитит склад через Math.min(available, need).
            // Раньше было 3с — на медленной сети клиенты видели «Отправка…»
            // слишком долго и заказ иногда не успевал пройти до закрытия
            // вкладки (уходил в offline queue → приходил только при
            // следующем визите).
            const freshDocsP = Promise.all(
              cart.map(item => db.collection('products').doc(item.id).get())
            );
            const freshTimeoutP = new Promise((_, reject) =>
              setTimeout(() => reject(new Error('__FRESH_CHECK_TIMEOUT__')), 1500)
            );
            const freshDocs = await Promise.race([freshDocsP, freshTimeoutP]);
            const summaryLinesHtml = [];
            const summaryLinesText = [];
            const newCart = [];
            for (let i = 0; i < freshDocs.length; i++) {
              const cartItem = cart[i];
              const snap = freshDocs[i];
              if (!snap.exists) {
                summaryLinesHtml.push('🗑️ <strong>' + cartItem.title + '</strong> — товар удалён, убран из корзины');
                summaryLinesText.push('🗑️ ' + cartItem.title + ' — товар удалён из каталога');
                continue;
              }
              const p = snap.data();
              const localP = products.find(x => x.id === cartItem.id);
              if (localP) {
                if (p.stock !== undefined) localP.stock = p.stock;
                if (p.warehouseStock !== undefined) localP.warehouseStock = p.warehouseStock;
              }
              if (typeof p.stock !== 'number' || !isFinite(p.stock)) {
                newCart.push(cartItem);
                continue;
              }
              const freshStock = (typeof getEffectiveStock === 'function')
                ? getEffectiveStock(Object.assign({ id: cartItem.id }, p))
                : Math.max(0, Math.floor(p.stock));
              if (freshStock === null) {
                newCart.push(cartItem);
                continue;
              }
              const need = Math.max(0, Math.floor(cartItem.qty || 0));
              if (freshStock <= 0) {
                summaryLinesHtml.push('😔 <strong>' + cartItem.title + '</strong> — только что закончился, убран из корзины');
                summaryLinesText.push('😔 ' + cartItem.title + ' × ' + need + ' — распродано в момент оформления');
              } else if (freshStock < need) {
                summaryLinesHtml.push('⚠️ <strong>' + cartItem.title + '</strong> — было ' + need + ' → осталось только ' + freshStock);
                summaryLinesText.push('⚠️ ' + cartItem.title + ' — хотели ' + need + ', отгружено ' + freshStock);
                newCart.push({ ...cartItem, qty: freshStock });
              } else {
                newCart.push(cartItem);
              }
            }

            if (summaryLinesHtml.length > 0) {
              orderAdjustments = summaryLinesText.slice();

              if (newCart.length === 0) {
                // Весь заказ невыполним → создаём как unfulfilled.
                // Восстанавливаем корзину, чтобы админ видел что клиент хотел.
                isUnfulfilledOrder = true;
                cart.length = 0;
                cart.push(...originalCartSnapshot);
                // total/items не пересчитываем (они соответствуют «хотелке» клиента).
              } else {
                // Часть товаров всё ещё можно отправить — работаем как обычно.
                cart.length = 0;
                cart.push(...newCart);
                if (typeof saveCart === 'function') try { saveCart(); } catch(e) {}
                if (typeof renderCart === 'function') try { renderCart(); } catch(e) {}

                total = cart.reduce((sum, item) => sum + item.qty * item.price, 0);
                items = cart.map(i => {
                  const product = products.find(p => p.id === i.id);
                  const unitLabel = (product && product.isPack) ? 'пачка' : 'шт';
                  const packInfo = (product && product.isPack && product.packQty) ? ` (~${product.packQty} шт/пачка)` : '';
                  const variantInfo = i.variant ? ` [${i.variant}]` : '';
                  return `${i.title}${variantInfo}${packInfo} — ${i.qty} ${unitLabel} × ${i.price} сом = ${i.qty * i.price} сом`;
                }).join('\n');

                Swal.fire({
                  toast: true,
                  position: 'top',
                  icon: 'warning',
                  title: 'Корзина обновлена',
                  html: summaryLinesHtml.join('<br>') +
                    '<div style="margin-top:6px; color:#2e7d32; font-weight:700;">Заказ на ' + total.toLocaleString() + ' сом</div>',
                  timer: 8000,
                  timerProgressBar: true,
                  showConfirmButton: false,
                  showCloseButton: true
                });
              }
            }
          } catch (freshErr) {
            // Если проверка не прошла (таймаут / сеть) — идём дальше,
            // отправляем заказ с текущей корзиной. CF на сервере всё равно
            // защитит склад от ухода в минус (Math.min(available, need)).
            if (freshErr && freshErr.message === '__FRESH_CHECK_TIMEOUT__') {
              console.warn('[Cart] Проверка остатков >3с — пропускаем, отправляем как есть');
            } else {
              console.warn('[Cart] Не удалось перепроверить остатки перед заказом:', freshErr);
            }
          }
        }

        // ============ ЗАКАЗ БЫСТРО; склад списывает только Cloud Function ============
        submitBtn.textContent = '⏳ Отправка...';

        // Ждём Firebase Auth перед записью И одновременно дожидаемся
        // поиска партнёра (partnerLookupP запущен выше параллельно с
        // fresh-check, чтобы не блокировать заказ). Обычно auth уже
        // готов с момента loadProducts, так что фактически мгновенно.
        // 500мс hard-таймаут — раньше было 1.5с, но Firestore
        // offline-persistence записывает в IndexedDB и без auth,
        // а SDK сам добьёт auth-токен при синхронизации.
        const authWaitP = (typeof kerbenWaitForAuth === 'function')
          ? kerbenWaitForAuth(500).catch(() => {})
          : Promise.resolve();
        const [ , partnerFromLookup ] = await Promise.all([authWaitP, partnerLookupP]);
        if (!partner && partnerFromLookup) partner = partnerFromLookup;

        const orderRef = db.collection('orders').doc();

        // Валидация корзины (наличие, остатки) уже сделана выше в блоке проверки товаров.

        const orderPayload = {
          name, phone, address,
          driverName: driverName || null, driverPhone: driverPhone || null,
          items: cart.map(item => ({
            id: item.id, title: item.title, qty: item.qty, price: item.price,
            image: item.image || null,
            costPrice: item.costPrice || 0, sellerId: item.sellerId || null,
            sellerName: item.sellerName || null, variant: item.variant || null
          })),
          total, timestamp: Date.now(), time: currentTime,
          status: isUnfulfilledOrder ? 'unfulfilled' : 'pending',
          partner: partner || null, referredBy: referredBy || null,
          // Кто оформил заказ. Если это агент со своего планшета — тут его
          // данные. В карточке заказа админ увидит, что имя/телефон в
          // заказе это КЛИЕНТ, а оформлял его агент.
          placedByAgent: agentInfo ? {
            id: agentInfo.id,
            name: agentInfo.name,
            phone: agentInfo.phone || null
          } : null,
          placedByAgentId: agentInfo ? agentInfo.id : null,
          placedByAgentName: agentInfo ? agentInfo.name : null,
          agentId: agentInfo ? agentInfo.id : null,
          stockDeducted: false,
          // stockDeductionStatus ВСЕГДА 'pending' — так требуют правила Firestore
          // (клиент не может подделать статус списания). Для unfulfilled-заказов
          // Cloud Function проверяет data.status и пропускает списание сама.
          stockDeductionStatus: 'pending',
          warehouseDeductions: null,
          // Для админа: что было скорректировано / что клиент хотел
          orderAdjustments: orderAdjustments.length > 0 ? orderAdjustments : null,
          unfulfilledOrder: isUnfulfilledOrder || null,
          unfulfilledReason: isUnfulfilledOrder ? 'stock_out_at_checkout' : null
        };

        // Пишем только заказ. Списание — deductStockOnOrderCreate на сервере.
        // ВАЖНО: Firestore SDK имеет offline-persistence — вызов set()
        // мгновенно пишет в локальный IndexedDB и ставит запись в очередь
        // синхронизации. Даже если промис не разрешится за 8с, заказ
        // уже гарантированно сохранён локально и уйдёт когда появится
        // связь (даже если клиент закроет вкладку).
        const _snapshotCart = [...cart];

        // ДОП. ЗАЩИТА: сохраняем копию заказа в localStorage ПЕРЕД отправкой.
        // Нужно на случай если Firestore persistence не работает (incognito,
        // старый браузер). При следующем открытии сайта js/pending-orders.js
        // перепошлёт заказы которых нет на сервере.
        if (typeof savePendingOrderBackup === 'function') {
          try { savePendingOrderBackup(orderRef.id, orderPayload); } catch (e) {}
        }

        // ═══════════════════════════════════════════════════════════
        //   NEW (v4.26): orderNotify — ГЛАВНЫЙ канал доставки заказа.
        // ═══════════════════════════════════════════════════════════
        // Что изменилось vs v4.25:
        //   v4.25: .set() запускался с UI-таймаутом 3.5с, orderNotify
        //          отдельно в fire-and-forget → backup чистился ТОЛЬКО
        //          если orderNotify успевал подтвердить (может пропустить).
        //   v4.26: orderNotify — ОСНОВНОЙ. Race([orderNotify(5с), .set()])
        //          - orderNotify.firestoreOk=true → SERVER-CONFIRMED → чистим backup
        //          - .set() резолвится первым → пишем в SDK queue, backup ЖИВ
        //          - таймаут 5с → оптимистичный UX, backup ЖИВ
        //          В 90% случаев (норм. сеть) заказ будет server-confirmed
        //          ДО того как клиент увидит «Принят».
        //
        // Почему orderNotify надёжнее чем .set():
        //   .set() ходит через Firestore SDK — требует Firebase Auth +
        //   App Check + rules. Любой из этих слоёв может отказать → SDK
        //   тихо кладёт запись в offline queue и резолвит промис как
        //   «локальный успех». Клиент видит «Принят», но на сервере
        //   заказа НЕТ (это и погубило заказ Замира).
        //   orderNotify — обычный HTTPS POST → нашу Cloud Function →
        //   admin SDK → Firestore. Auth не нужен. App Check не нужен.
        //   Работает всегда пока есть сеть.

        // 1) Сохраняем backup в localStorage ДО любых попыток
        //    (savePendingOrderBackup выше).

        // 2) Запускаем orderNotify (главный) и orderRef.set() (fallback)
        //    ПАРАЛЛЕЛЬНО. Кто быстрее — тот и «первый успех» для UI.
        let notifyFirestoreOk = false;
        const orderNotifyPromise = (typeof sendOrderTextToTelegram === 'function')
          ? sendOrderTextToTelegram(orderPayload, orderRef.id)
              .then(function (res) {
                res = res || {};
                if (res.firestoreOk === true) {
                  notifyFirestoreOk = true;
                  // SERVER-CONFIRMED. Чистим backup — заказ ТОЧНО в БД
                  // (admin SDK через orderNotify это подтвердил).
                  if (typeof removePendingOrderBackup === 'function') {
                    try { removePendingOrderBackup(orderRef.id); } catch (e) {}
                  }
                  // Автозаполнение клиента для агента — тоже только
                  // после server-confirmed.
                  if (agentInfo && typeof saveAgentClient === 'function') {
                    try { saveAgentClient({ name, phone, address }); } catch (e) {}
                  }
                } else {
                  console.warn('[Cart] orderNotify без server-confirm — backup оставляем для retry', res);
                }
                return res;
              })
              .catch(function (e) {
                console.warn('[Cart] orderNotify упал:', e && e.message);
                return null;
              })
          : Promise.resolve(null);

        const orderCommitPromise = orderRef.set(orderPayload);
        orderCommitPromise.catch(() => {}); // тихо (это fallback канал)

        // 3) Ждём первый успех: orderNotify.firestoreOk=true ИЛИ
        //    orderRef.set() резолвится ИЛИ таймаут 5 сек.
        //    Приоритет orderNotify (server-confirmed) — если он успевает,
        //    backup чистится в .then() выше. Если нет — оптимистичный
        //    UX через .set() или таймаут; backup остаётся до retry.
        //
        //    Таймаут 5с (было 3.5с) — даём orderNotify чуть больше времени,
        //    чтобы в 90% случаев UI показал «Принят» уже после server-confirmed.
        const uiConfirmPromise = new Promise(function (resolve) {
          let resolved = false;
          const finish = function (reason) {
            if (resolved) return;
            resolved = true;
            resolve(reason);
          };
          orderNotifyPromise.then(function (r) {
            if (r && r.firestoreOk === true) finish('notify');
          }, function () { /* игнор */ });
          orderCommitPromise.then(function () { finish('set'); },
                                  function () { /* игнор — ждём другие */ });
          setTimeout(function () { finish('timeout'); }, 5000);
        });
        try {
          const confirmReason = await uiConfirmPromise;
          console.log('[Cart] UI confirmed by "' + confirmReason + '" (notifyOk=' + notifyFirestoreOk + '):', orderRef.id);
          // Если UI подтвержден по 'timeout' — падаем в fallback ниже
          // (тот же путь что был по __TIMEOUT__). Иначе — успех.
          if (confirmReason === 'timeout') {
            throw new Error('__TIMEOUT__');
          }
        } catch (commitErr) {
          if (commitErr && commitErr.message === '__TIMEOUT__') {
            console.warn('[Cart] Сеть медленная — доотправляем в фоне');
            orderCommitPromise
              .then(() => {
                console.log('[Cart] Заказ дописан в фоне:', orderRef.id);
                cart.length = 0; saveCart(); renderCart();
                if (typeof sendOrderAsPDF === 'function') {
                  sendOrderAsPDF(name, phone, address, driverName, driverPhone,
                    _snapshotCart, total, currentTime).catch(() => {});
                }
                Swal.fire({
                  icon: 'success',
                  title: 'Заказ принят ✅',
                  text: 'Он был отправлен с задержкой, но всё дошло.',
                  timer: 3000, showConfirmButton: false
                });
              })
              .catch((e) => {
                console.error('[Cart] Заказ так и не сохранился:', e && e.message);
                Swal.fire({
                  icon: 'error',
                  title: 'Заказ не отправлен',
                  html: 'Сеть очень медленная. Проверьте интернет и попробуйте ещё раз.<br>Корзина сохранена.',
                  confirmButtonText: 'Понятно'
                });
              });
            // Показываем клиенту УСПЕХ сразу — заказ уже сохранён в
            // локальном IndexedDB (Firestore offline-persistence) и уйдёт
            // на сервер как только появится нормальный сигнал. Даже если
            // клиент закроет вкладку — при следующем открытии сайта
            // Firestore SDK сам досинхронизирует. Раньше показывали
            // «Сеть медленная… ждите» — это отпугивало.
            Swal.fire({
              icon: 'success',
              title: 'Заказ принят! ✅',
              html: 'Ваш заказ сохранён и уходит к нам.<br><small style="color:#666;">Даже если закроете страницу — доставится автоматически.</small>',
              timer: 3500,
              showConfirmButton: false
            });
            // Очищаем корзину — заказ гарантированно в очереди Firestore
            cart.length = 0; saveCart(); renderCart();
            // Фоновая отправка PDF, статистики и т.д. — как обычно
            orderCommitPromise
              .catch((e) => {
                console.error('[Cart] Заказ так и не сохранился:', e && e.message);
                // Молча — клиент уже увидел «принят», ничего не сломается
              });
            return;
          }
          throw commitErr;
        }

        // Оптимистично обновляем локальный кэш остатков (только UI; Firestore спишет CF)
        try {
          for (const orderedItem of _snapshotCart) {
            const p = products.find(x => x.id === orderedItem.id);
            if (!p || typeof p.stock !== 'number' || !isFinite(p.stock)) continue;
            if (warehousePaused) continue;
            const need = Math.max(0, Math.floor(orderedItem.qty || 0));
            if (p.warehouseStock && typeof p.warehouseStock === 'object' && Object.keys(p.warehouseStock).length > 0) {
              const primaryActive = primaryWarehouseId && !pausedWarehouseIds.has(primaryWarehouseId);
              if (primaryActive) {
                const have = Math.max(0, Math.floor(p.warehouseStock[primaryWarehouseId] || 0));
                p.warehouseStock[primaryWarehouseId] = have - Math.min(need, have);
              } else {
                let rem = need;
                Object.keys(p.warehouseStock).forEach(function (whId) {
                  if (pausedWarehouseIds.has(whId) || rem <= 0) return;
                  const have = Math.max(0, Math.floor(p.warehouseStock[whId] || 0));
                  const d = Math.min(rem, have);
                  p.warehouseStock[whId] = have - d;
                  rem -= d;
                });
              }
              p.stock = Object.values(p.warehouseStock).reduce((s, v) => s + (Number(v) || 0), 0);
            } else {
              p.stock = Math.max(0, Math.floor(p.stock) - need);
            }
          }
        } catch (e) {}

        // ============ ЗАКАЗ УСПЕШНО СОХРАНЁН ============
        // Сразу: показываем успех + очищаем корзину + разблокируем кнопку
        // Всё некритичное (авторегистрация, PDF) идёт в фоне без await

        // Сохраняем данные для PDF/Telegram ДО очистки корзины
        const orderData = { name, phone, address, driverName, driverPhone, cart: [...cart], total, currentTime };
        const driverInfoText = (driverName || driverPhone) ? `\nВодитель: ${driverName || '-'}\nТел. водителя: ${driverPhone || '-'}` : '';

        if (isUnfulfilledOrder) {
          Swal.fire({
            icon: 'warning',
            title: 'Ваш запрос зарегистрирован',
            html: '<div style="text-align:left; margin-top:6px;">' +
              '<div style="color:#c62828; font-weight:600; margin-bottom:8px;">К сожалению, все товары были распроданы прямо в момент оформления:</div>' +
              '<div style="font-size:13px; color:#555; line-height:1.6;">' + orderAdjustments.join('<br>') + '</div>' +
              '<div style="background:#e3f2fd; border-left:3px solid #1976d2; padding:10px; margin-top:12px; border-radius:4px; font-size:13px; color:#1565c0;">📞 Наш менеджер свяжется с вами по указанному номеру и подскажет альтернативы или сроки поставки.</div>' +
              '</div>',
            confirmButtonText: 'Понятно',
            confirmButtonColor: '#28a745'
          });
        } else {
          Swal.fire({
            icon: 'success',
            title: 'Заказ принят! ✅',
            text: 'Ваш заказ успешно отправлен.',
            timer: 2200,
            showConfirmButton: false
          });
        }

        // Очищаем корзину СРАЗУ
        cart.length = 0;
        saveCart();
        renderCart();

        // Разблокируем кнопку СРАЗУ
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.textContent = originalText;

        // ============ ВСЁ НИЖЕ — ФОНОВОЕ (fire-and-forget) ============

        // Сохраняем данные пользователя (синхронно, мгновенно).
        // ВАЖНО: если заказ оформляет агент — НЕ перезаписываем его userData
        // данными клиента, иначе в профиле агента поменяется имя/телефон/адрес
        // на данные последнего клиента. Вместо этого сохраняем клиента
        // в отдельный список `agentClients` — оттуда работают автоподсказки
        // при вводе имени/телефона в следующих заказах.
        if (agentInfo) {
          // ⚠️ saveAgentClient() ПЕРЕНЕСЁН вверх — вызывается только
          // после server-confirmed через orderNotify (см. orderNotifyPromise).
          // Раньше он вызывался здесь, но это давало ложное впечатление
          // что заказ прошёл — данные клиента сохранялись даже если
          // заказ застревал в SDK offline queue и терялся.
          // Водитель/телефон водителя относятся к самому агенту (его планшет),
          // поэтому их можно спокойно сохранить в его userData —
          // но НЕ имя/телефон/адрес.
          try {
            const existingUserData = JSON.parse(localStorage.getItem('userData') || '{}');
            existingUserData.driverName = driverName || existingUserData.driverName || '';
            existingUserData.driverPhone = driverPhone || existingUserData.driverPhone || '';
            localStorage.setItem('userData', JSON.stringify(existingUserData));
          } catch(e) {}
        } else {
          localStorage.setItem('userData', JSON.stringify({ name, phone, address, driverName, driverPhone }));
        }

        saveOrderToHistory({
          name, phone, address, driverName: driverName || null, driverPhone: driverPhone || null,
          items: orderData.cart, total, timestamp: Date.now(), time: currentTime, status: 'pending'
        });

        try {
          if (minOrderEnabled && minOrderAmount > 0 && total >= minOrderAmount) {
            const endOfDay = new Date();
            endOfDay.setHours(23, 59, 59, 999);
            localStorage.setItem('minOrderBypass', JSON.stringify({ phone, until: endOfDay.getTime() }));
          }
        } catch(e) {}

        // Авторегистрация клиента — ФОНОВО (не блокируем UI)
        // ВАЖНО: если заказ оформлял АГЕНТ, то:
        //   • firebaseUid НЕ привязываем к записи клиента (это UID агента,
        //     иначе клиент будет доступен под аккаунтом агента).
        //   • localStorage.customerData и PersistProfile НЕ трогаем —
        //     иначе профиль агента заменится на данные клиента.
        //   • passwordHash тоже не проставляем (это придумывается автоматом
        //     от номера — но для клиента, введённого агентом, пусть клиент
        //     сам зарегистрируется, если захочет).
        const _isPlacedByAgent = !!agentInfo;

        // ═══════════════════════════════════════════════════════════
        // ВАЖНО: сохраняем customerData в localStorage ПЕРВЫМ ДЕЛОМ,
        // ДО любых Firestore-вызовов. Иначе если Firestore недоступен
        // (permission-denied, оффлайн, квота исчерпана и т.п.) — код
        // ниже упадёт в catch, и профиль клиента останется несохранён.
        // Тогда пользователь после заказа не сможет автоматически
        // войти в личный кабинет.
        // ═══════════════════════════════════════════════════════════
        if (!_isPlacedByAgent) {
          try {
            const _localPhone = phone.replace(/[^\d+]/g, '');
            const _nPhoneLocal = _localPhone.startsWith('0') ? '+996' + _localPhone.substring(1) :
                                 _localPhone.startsWith('+') ? _localPhone :
                                 _localPhone.startsWith('996') ? '+' + _localPhone : '+996' + _localPhone;
            const customerDataForProfile = {
              id: _nPhoneLocal, name, phone: _nPhoneLocal, address: address || '', createdAt: Date.now()
            };
            localStorage.setItem('customerData', JSON.stringify(customerDataForProfile));
            if (window.PersistProfile) window.PersistProfile.save(customerDataForProfile);
            console.log('[Cart] customerData сохранён локально (до Firestore-попыток)');
          } catch(e) { console.warn('[Cart] локальное сохранение customerData:', e && e.message); }
        }

        (async function _bgCustomerReg() {
          try {
            const normalizedPhone = phone.replace(/[^\d+]/g, '');
            const nPhone = normalizedPhone.startsWith('0') ? '+996' + normalizedPhone.substring(1) : 
                           normalizedPhone.startsWith('+') ? normalizedPhone : 
                           normalizedPhone.startsWith('996') ? '+' + normalizedPhone : '+996' + normalizedPhone;
            
            const _autoPwd = nPhone.slice(-4);
            const _autoPwdHash = (!_isPlacedByAgent && typeof _hashCustomerPassword === 'function')
              ? await _hashCustomerPassword(_autoPwd, nPhone)
              : null;

            let _curUid = null;
            try {
              if (typeof kerbenWaitForAuth === 'function') await kerbenWaitForAuth();
              if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                _curUid = firebase.auth().currentUser.uid;
              }
            } catch(e) {}

            const customerDoc = await db.collection('customers').doc(nPhone).get();
            if (!customerDoc.exists) {
              const newCustomer = {
                name, phone: nPhone, address,
                registeredAt: firebase.firestore.FieldValue.serverTimestamp(),
                totalOrders: 1, totalSpent: total,
                createdAt: Date.now()
              };
              if (_autoPwdHash) newCustomer.passwordHash = _autoPwdHash;
              // Привязываем firebaseUid ТОЛЬКО если заказ делает сам клиент.
              // Иначе (агент оформляет за клиента) — оставляем без UID.
              if (_curUid && !_isPlacedByAgent) newCustomer.firebaseUid = _curUid;
              if (_isPlacedByAgent && agentInfo) {
                newCustomer.registeredByAgentId = agentInfo.id;
                newCustomer.registeredByAgentName = agentInfo.name;
              }
              await db.collection('customers').doc(nPhone).set(newCustomer);
            } else {
              const existingData = customerDoc.data() || {};
              let _canUpdate = true;
              if (_curUid && !existingData.firebaseUid && !_isPlacedByAgent) {
                try {
                  await db.collection('customers').doc(nPhone).update({ firebaseUid: _curUid });
                } catch (e) {
                  console.warn('[cart] не удалось привязать firebaseUid:', e && e.message);
                  _canUpdate = false;
                }
              } else if (existingData.firebaseUid && _curUid && existingData.firebaseUid !== _curUid && !_isPlacedByAgent) {
                _canUpdate = false;
              }
              if (_canUpdate) {
                try {
                  await db.collection('customers').doc(nPhone).update({
                    name, address,
                    totalOrders: firebase.firestore.FieldValue.increment(1),
                    totalSpent: firebase.firestore.FieldValue.increment(total)
                  });
                } catch (e) {
                  console.warn('[cart] не удалось обновить customer:', e && e.message);
                }
              }
            }
            
            // Профиль в localStorage / PersistProfile обновляем ТОЛЬКО когда
            // заказ оформляет сам клиент. Для агента — не трогаем, чтобы
            // не затереть его собственные данные.
            if (!_isPlacedByAgent) {
              const customerDataForProfile = {
                id: nPhone, name, phone: nPhone, address: address || '', createdAt: Date.now()
              };
              try { localStorage.setItem('customerData', JSON.stringify(customerDataForProfile)); } catch(e) {}
              if (window.PersistProfile) window.PersistProfile.save(customerDataForProfile);
              console.log('[Cart] ✅ Профиль клиента сохранён');
            } else {
              console.log('[Cart] 👤 Заказ от агента — профиль клиента в customers, локальный профиль агента не тронут');
            }
          } catch(e) { console.log('Customer update error:', e); }
        })();

        // Фоновая отправка PDF с фото
        loadCartExportLibs().then(() => {
          if (typeof sendOrderAsPDF === 'function') {
            sendOrderAsPDF(orderData.name, orderData.phone, orderData.address, orderData.driverName, orderData.driverPhone, orderData.cart, orderData.total, orderData.currentTime)
              .then(() => console.log('PDF с фото отправлен'))
              .catch(e => console.error('PDF photo error:', e));
          }
        }).catch(e => console.error('loadCartExportLibs error:', e));

      } catch (error) {
        console.error('Order error:', error);
        Swal.fire('Ошибка', error.message || 'Не удалось отправить заказ', 'error');
        try {
          const msg = String(error.message || '');
          if (msg.includes('quota') || msg.includes('429') || msg.includes('too many')) {
            localStorage.setItem('firestoreCooldownUntil', String(Date.now() + 45000));
          }
        } catch(e) {}
      } finally {
        // ВСЕГДА разблокируем кнопку — даже если что-то неожиданное
        // упало посередине (например, Swal.fire бросил). Раньше при
        // необработанной ошибке кнопка навсегда оставалась в состоянии
        // «⏳ Проверка остатков…» / «⏳ Сохранение…».
        try {
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          submitBtn.textContent = originalText;
        } catch (e) {}
      }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      // Фоново подтягиваем клиентов агента из Firestore, если localStorage
      // был очищен (новое устройство / очистка Chrome). Один раз за сессию.
      try { restoreAgentClientsFromCloud(); } catch(e) {}
    });

    // Слушаем сообщение от родителя для обновления корзины при повторном открытии
    window.addEventListener('message', function(e) {
      if (e.data === 'refreshCart') {
        cart = JSON.parse(localStorage.getItem('cart') || '[]');
        renderCart();
      }
    });
  </script>
